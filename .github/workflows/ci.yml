# Validate every push and pull request.
#
# `prepublishOnly` already gates the registry, but that only runs at release:
# until this existed, a commit could sit on main for a week with a failing
# test and nothing would say so. Lint is included because it is not part of
# `prepublishOnly` and so had no gate at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The library's own work, on both the floor `package.json` declares and a
  # current release — so a syntax or API level that needs newer fails here
  # rather than in a consumer's runtime.
  #
  # Typecheck and tests only. The bundler is toolchain, and it does not run on
  # the floor either (see `bundle`).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run test

  # Lint and bundle, deliberately NOT on the declared floor. Both tools need
  # newer Node than the library does — the shared eslint config reaches
  # `Object.groupBy` (Node 21+), and tsdown cannot import `unrun` on 20. Those
  # are constraints on this repo's toolchain, not on the package: consumers
  # never run either, and `release.yml` builds on 22. Pinning them to the floor
  # only fails the build for a reason no user can encounter.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` is `eslint --fix`, which would report success after
      # rewriting the tree. `--no-fix` is what actually asks a question.
      - run: pnpm exec eslint . --no-fix

      - run: pnpm run build
