# Validate every push and pull request.
#
# `prepublishOnly` already gates the registry, but that only runs at release:
# until this existed, a commit could sit on main for a week with a failing
# test and nothing would say so. Lint is included because it is not part of
# `prepublishOnly` and so had no gate at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The library's own work, on both the floor `package.json` declares and a
  # current release — so a syntax or API level that needs newer fails here
  # rather than in a consumer's runtime.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build

  # Separate, and deliberately NOT on the floor: the shared eslint config
  # reaches `Object.groupBy`, which needs Node 21+. That is a constraint on
  # this repo's dev toolchain, not on the library — consumers never run it —
  # so pinning lint to the declared floor only fails the build for a reason
  # no user can encounter.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` is `eslint --fix`, which would report success after
      # rewriting the tree. `--no-fix` is what actually asks a question.
      - run: pnpm exec eslint . --no-fix
