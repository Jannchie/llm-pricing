# Publish to npm via trusted publishing (OIDC) — no long-lived token.
#
# Configure the trusted publisher once at
# https://www.npmjs.com/package/llm-pricing/access with:
#   Organization or user: Jannchie
#   Repository:           llm-pricing
#   Workflow filename:    release.yml     <- this file's name, not its path
#   Environment:          (leave empty)
#   Allowed actions:      npm publish
#
# Release by pushing a tag that matches the version in package.json:
#   pnpm version patch && git push --follow-tags

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the runner mint the OIDC token npm exchanges for publish rights.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Trusted publishing needs Node >= 22.14.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # ...and npm >= 11.5.1, which is newer than what the runner ships.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json publishes a version nobody
      # asked for, under a tag pointing at different code. Fail loudly.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # prepublishOnly runs typecheck, the full test suite and the build,
      # so a broken commit cannot reach the registry.
      #
      # `npm publish` (not `pnpm publish`) because OIDC trusted publishing
      # lives in the npm CLI. Provenance is attested automatically for a
      # public package from a public repo.
      - run: npm publish
